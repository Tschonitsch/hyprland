#════════════════ Decoration ═══════════════╗
decoration {                               #║
    rounding = 10                          #║
    rounding_power = 2                     #║
    active_opacity = 1.0                   #║
    inactive_opacity = 1.0                 #║
    fullscreen_opacity = 1.0               #║
    dim_modal = true                       #║
    dim_inactive = false                   #║
    dim_strength = 0.5                     #║
    dim_special = 0.2                      #║
    dim_around = 0.4                       #║
    #screen_shader = /path/to/shader       #║
    border_part_of_window = true           #║
                                           #║
    blur {                                 #║
        enabled = true                     #║
        size = 3                           #║ [min = 1]
        passes = 3                         #║ [min = 1]
        ignore_opacity = true              #║
        new_optimizations = true           #║
        xray = false                       #║
        noise = 0.01                       #║ [0.0 - 1.0]
        contrast = 1.0                     #║ [0.0 - 2.0]
        brightness = 1.0                   #║ [0.0 - 2.0]
        vibrancy = 0.0                     #║ [0.0 - 1.0]
        vibrancy_darkness = 0.0            #║ [0.0 - 1.0]
        special = false                    #║
        popups = true                      #║
        popups_ignorealpha = 0.2           #║ [0.0 - 1.0]
        input_methods = false              #║
        input_methods_ignorealpha = 0.2    #║ [0.0 - 1.0]
    }                                      #║
                                           #║
    shadow {                               #║
        enabled = true                     #║
        range = 10                         #║
        render_power = 3                   #║ [1 - 4]
        sharp = false                      #║
        ignore_window = true               #║
        color = rgba(d3c6aa55)             #║
        color_inactive = rgba(d3c6aa22)    #║
        offset = 0, 0                      #║
        scale = 1.0                        #║ [0.0 - 1.0]
    }                                      #║
                                           #║
    glow {                                 #║
        enabled = true                     #║
        range = 20                         #║
        render_power = 3                   #║ [1 - 4]
        color = rgba(d3c6aa55)             #║
        color_inactive = rgba(d3c6aa22)    #║
    }                                      #║
}                                          #║
#════════════════ Decoration ═══════════════╝

#═════════════════ General ═════════════════╗
general {                                  #║
    border_size = 2                        #║
    gaps_in = 4                            #║
    gaps_out = 10                          #║
    float_gaps = 10                        #║
                                           #║
    gaps_workspaces = 0                    #║
    col.active_border = rgba(d3c6aaAA)     #║
    col.inactive_border = rgba(d3c6aa33)   #║
    col.nogroup_border_active = rgba(d3c6aaAA)
    col.nogroup_border = rgba(00000000)    #║
                                           #║
    layout = dwindle                       #║
    no_focus_fallback = false              #║
    resize_on_border = false               #║
    extend_border_grab_area = 15           #║
    hover_icon_on_border = true            #║
    allow_tearing = false                  #║
    resize_corner = 0                      #║
    modal_parent_blocking = true           #║
    snap {                                 #║
        enabled = true                     #║
        window_gap = 10                    #║
        monitor_gap = 10                   #║
        border_overlap = false             #║
        respect_gaps = true                #║
    }                                      #║
}                                          #║
#═════════════════ General ═════════════════╝

#══════════════════ Cursor ═════════════════╗
env = GTK_THEME,adw-gtk3-dark              #║
                                           #║
env = XCURSOR_THEME,Kitty                  #║
env = HYPRCURSOR_THEME,Kitty               #║
                                           #║
env = XCURSOR_SIZE,30                      #║
env = HYPRCURSOR_SIZE,30                   #║
#══════════════════ Cursor ═════════════════╝
