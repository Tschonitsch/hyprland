#══════ Mod Key ════╗
$secMod = Super    #║
$mainMod = ALT     #║
#══════ Mod Key ════╝

#═════════════ Programs ════════════╗
$terminal = kitty                  #║
$fileManager = dolphin             #║
$menu = rofi -show drun            #║
$browser = zen-browser             #║
$editor = kitty --title nvim nvim  #║
#═════════════ Programs ════════════╝

#════════════════════════════════════ Audio ════════════════════════════════════╗
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- #║
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+ #║
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle       #║
#════════════════════════════════════ Audio ════════════════════════════════════╝

#══════════════════════════════════ Shortcuts ══════════════════════════════════╗
# Terminal / TUIs                                                               ║
bind = $mainMod, T, exec, $terminal                                            #║
bind = $mainMod, O, exec, $terminal opencode                                   #║
bind = $mainMod, Q, exec, $terminal --title kittyfloat                         #║
bind = $mainMod, E, exec, $terminal --title superfile zsh -ic "spf; exec zsh"  #║
bind = $mainMod, M, exec, $terminal --title rmpc rmpc                          #║
                                                                               #║
# Hyprland                                                                      ║
bind = $mainMod, C, killactive,                                                #║
bind = $mainMod, B, togglefloating,                                            #║
bind = $mainMod, F, fullscreen, 0                                              #║
bind = $mainMod, V, layoutmsg, togglesplit                                     #║
                                                                               #║
# Programs                                                                     #║
bind = $mainMod, A, exec, $browser                                             #║
bind = $mainMod, D, exec, $menu                                                #║
bind = $mainMod, S, exec, $editor                                              #║
                                                                               #║
# Scripts                                                                       ║
bind = $mainMod, R, exec, ~/.config/waybar/scripts/launch.sh                   #║
#══════════════════════════════════ Shortcuts ══════════════════════════════════╝

#═════════════ Window Keybinds ═════════════╗
# Snapwindow                                ║
bind = $mainMod $secMod, h,  swapwindow, l #║
bind = $mainMod $secMod, l,  swapwindow, r #║
bind = $mainMod $secMod,k,  swapwindow, u  #║
bind = $mainMod $secMod, j,  swapwindow, d #║
                                           #║
# Move Focus                                ║
bind = $mainMod, h, movefocus, l           #║
bind = $mainMod, l, movefocus, r           #║
bind = $mainMod, k, movefocus, u           #║
bind = $mainMod, j, movefocus, d           #║
                                           #║
# Move Window                               ║
bind = $mainMod SHIFT, h,  movewindow, l   #║
bind = $mainMod SHIFT, l,  movewindow, r   #║
bind = $mainMod SHIFT, k,    movewindow, u #║
bind = $mainMod SHIFT, j,  movewindow, d   #║
#═════════════ Window Keybinds ═════════════╝

#══════════════ Scroll Workspaces ══════════════╗
bind = $mainMod Control, l, workspace, r+1     #║
bind = $mainMod Control, h, workspace, r-1     #║
bind = $mainMod, mouse_down, workspace, e+1    #║
bind = $mainMod, mouse_up, workspace, e-1      #║
#══════════════ Scroll Workspaces ══════════════╝

#═════════ Switch Workspace ════════╗
bind = $mainMod, 1, workspace, 1   #║
bind = $mainMod, 2, workspace, 2   #║
bind = $mainMod, 3, workspace, 3   #║
bind = $mainMod, 4, workspace, 4   #║
bind = $mainMod, 5, workspace, 5   #║
bind = $mainMod, 6, workspace, 6   #║
bind = $mainMod, 7, workspace, 7   #║
bind = $mainMod, 8, workspace, 8   #║
bind = $mainMod, 9, workspace, 9   #║
bind = $mainMod, 0, workspace, 10  #║
#═════════ Switch Workspace ════════╝

#═══════════ mv Window to Workspace ════════════╗
bind = $mainMod SHIFT, 1, movetoworkspace, 1   #║
bind = $mainMod SHIFT, 2, movetoworkspace, 2   #║
bind = $mainMod SHIFT, 3, movetoworkspace, 3   #║
bind = $mainMod SHIFT, 4, movetoworkspace, 4   #║
bind = $mainMod SHIFT, 5, movetoworkspace, 5   #║
bind = $mainMod SHIFT, 6, movetoworkspace, 6   #║
bind = $mainMod SHIFT, 7, movetoworkspace, 7   #║
bind = $mainMod SHIFT, 8, movetoworkspace, 8   #║
bind = $mainMod SHIFT, 9, movetoworkspace, 9   #║
bind = $mainMod SHIFT, 0, movetoworkspace, 10  #║
#═══════════ mv Window to Workspace ════════════╝

#═════════════════ rez Window ══════════════════╗
bind = CTRL SHIFT, h,  resizeactive, -40 0     #║
bind = CTRL SHIFT, l, resizeactive,  40 0      #║
bind = CTRL SHIFT, k,    resizeactive,  0 -40  #║
bind = CTRL SHIFT, j,  resizeactive,  0  40    #║
#═════════════════ rez Window ══════════════════╝

#════════ mv / rez Window With Mouse ═══════╗
bindm = $mainMod, mouse:272, movewindow    #║
bindm = $mainMod, mouse:273, resizewindow  #║
#════════ mv / rez Window With Mouse ═══════╝

#═══════════════════════════════════════════════════════════ Screenshot ════════════════════════════════════════════════════════╗
bind = $mainMod SHIFT, S, exec, bash -c 'grim -g "$(slurp)" /home/chris/Pictures/screenshots/$(date +'%Y-%m-%d_%H-%M-%S').png' #║
bind = $mainMod CTRL, S, exec, grim /home/chris/Pictures/screenshots/$(date +'%Y-%m-%d_%H-%M-%S').png                          #║
#═══════════════════════════════════════════════════════════ Screenshot ════════════════════════════════════════════════════════╝
