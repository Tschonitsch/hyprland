# https://wiki.hypr.land/Configuring/

# --------------
# 1. Sources
# --------------

source = ~/.config/hypr/variables.conf
source = ~/.config/hypr/autostart.conf
source = ~/.config/hypr/decoration.conf
source = ~/.config/hypr/keybindings.conf
source = ~/.config/hypr/animations.conf

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf


# ---------------
# 2. MONITORS                       See https://wiki.hypr.land/Configuring/Monitors/
# ---------------
monitor = DP-1, 2560x1440@320, 0x0, 1
monitor = DP-2, 2560x1440@165, -1440x-570, 1, transform, 1

# ------------------------
# 2.1 Monitor Workspaces
# ------------------------

# Main Monitor
workspace = 1, monitor:DP-1
workspace = 2, monitor:DP-1
workspace = 3, monitor:DP-1
workspace = 4, monitor:DP-1
workspace = 5, monitor:DP-1


# Linker Monitor
workspace = 6, monitor:DP-2
workspace = 7, monitor:DP-2
workspace = 8, monitor:DP-2
workspace = 9, monitor:DP-2
workspace = 10, monitor:DP-2


# ---------------------------
# 5. ENVIRONMENT VARIABLES          https://wiki.hypr.land/Configuring/Environment-variables/
# ---------------------------
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24


# -----------------
# 6. PERMISSIONS                    https://wiki.hypr.land/Configuring/Permissions/
# -----------------
# Please note permission changes here require a Hyprland restart and are not applied on-the-fly
# for security reasons

# ecosystem {
#   enforce_permissions = 1
# }

# permission = /usr/(bin|local/bin)/grim, screencopy, allow
# permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
# permission = /usr/(bin|local/bin)/hyprpm, plugin, allow


# ---------------------
# 9. Workspace Rules                https://wiki.hypr.land/Configuring/Workspace-Rules/
# ---------------------

# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule {
#     name = no-gaps-wtv1
#     match:float = false
#     match:workspace = w[tv1]
#
#     border_size = 0
#     rounding = 0
# }
#
# windowrule {
#     name = no-gaps-f1
#     match:float = false
#     match:workspace = f[1]
#
#     border_size = 0
#     rounding = 0
# }

# --------------
# 10. Dwindle                           https://wiki.hypr.land/Configuring/Dwindle-Layout/ for more
# ---------------
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}


# -------------
# 11. Master                            https://wiki.hypr.land/Configuring/Master-Layout/ for more
# -------------
master {
    new_status = master
}


# ------------
# 12. Misc                              https://wiki.hypr.land/Configuring/Variables/#misc
# ------------
misc {
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
}


# -------------
# 13. INPUT                             https://wiki.hypr.land/Configuring/Variables/#input
# -------------
input {
    kb_layout = de
    kb_variant =
    kb_model =
    kb_options = caps:escape
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
    }
}


# ----------------
# 13.1 Gestures                         https://wiki.hypr.land/Configuring/Gestures
# ----------------
gesture = 3, horizontal, workspace


# -------------------------
# 13.2 Per-Device config                https://wiki.hypr.land/Configuring/Keywords/#per-device-input-configs
# -------------------------
device {
    name =
    sensitivity = -0.5
}

# -----------------------------------
# 15. Windows and Workspaces Rules
# -----------------------------------

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

# Hyprland-run windowrule
windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}